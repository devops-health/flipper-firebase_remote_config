AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'pkg/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 100

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 250

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# The Flipper adapter contract dictates these method names. They return true
# (so the predicate cop fires) but we can't rename them.
Naming/PredicateMethod:
  AllowedMethods:
    - add
    - remove
    - clear
    - enable
    - disable

# Flipper's adapter interface defines get_multi / get_all. Allow get_ prefixes
# in the adapter file only.
Naming/AccessorMethodName:
  Exclude:
    - 'lib/flipper/adapters/firebase_remote_config.rb'

Style/Documentation:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: never

Style/FrozenStringLiteralComment:
  Enabled: false
